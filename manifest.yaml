dist:
  module: github.com/joaochiroli/projeto-otel-na-pratica/construido-seu-collector
  name: meucollector
  description: Uma distribuição criada como parte da Especialização em Otel da Dose de Telemetria
  version: 1.0.0
  output_path: ./_build
  build_tags: "grpcnotrace"

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/basicauthextension v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/headerssetterextension v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oauth2clientauthextension v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oidcauthextension v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.134.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.134.0
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.134.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.134.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter v0.134.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.134.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricstransformprocessor v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.134.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/nopreceiver v0.134.0
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.134.0

connectors:
  - gomod: go.opentelemetry.io/collector/connector/forwardconnector v0.134.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector v0.134.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.40.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.40.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.40.0

# When adding a replace, add a comment before it to document why it's needed and when it can be removed
replaces:
  # see https://github.com/openshift/api/pull/1515
  - github.com/openshift/api => github.com/openshift/api v0.0.0-20230726162818-81f778f3b3ec
  # see https://github.com/open-telemetry/opentelemetry-collector/pull/13466
  - go.opentelemetry.io/otel/exporters/prometheus => go.opentelemetry.io/otel/exporters/prometheus v0.58.0