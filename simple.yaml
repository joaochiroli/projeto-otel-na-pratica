extensions:

receivers:
  otlp:
    protocols:
      grpc:
    
exporters:
  debug:
    verbosity: detailed

processors:
  transform:
    error_mode: ignore
    trace_statements:
    - statements:
      - set(resource.attributes["tenant"], "my-tenant")

connectors:
  count:

service:
  extensions: []
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [debug]
